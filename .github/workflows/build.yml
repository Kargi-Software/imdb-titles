name: Build titles

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IMDb datasets
        run: |
          curl -L https://datasets.imdbws.com/title.basics.tsv.gz | gunzip > basics.tsv
          curl -L https://datasets.imdbws.com/title.crew.tsv.gz | gunzip > crew.tsv
          curl -L https://datasets.imdbws.com/title.principals.tsv.gz | gunzip > principals.tsv
          curl -L https://datasets.imdbws.com/name.basics.tsv.gz | gunzip > names.tsv

      - name: Build JSONs
        run: |
          python3 << 'PY'
          import csv, json, os
          from collections import defaultdict

          def to_int(v):
              if not v or v == '\\N': return None
              try: return int(v)
              except: return None

          def to_genres(v):
              if not v or v == '\\N': return []
              return v.split(',')

          print("Loading names...")
          names = {}
          with open('names.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  names[r['nconst']] = r['primaryName']

          print("Loading basics...")
          basics = {}
          episode_ids = set()
          with open('basics.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  tt = r['tconst']
                  typ = r['titleType']
                  if typ in ('movie','tvSeries','tvMiniSeries','tvMovie','tvEpisode'):
                      basics[tt] = {
                          'title': r['primaryTitle'],
                          'type': typ,
                          'startYear': to_int(r.get('startYear')),
                          'endYear': to_int(r.get('endYear')),
                          'runtime': to_int(r.get('runtimeMinutes')),
                          'genres': to_genres(r.get('genres'))
                      }
                      if typ == 'tvEpisode':
                          episode_ids.add(tt)

          print("Loading creators...")
          creators_map = defaultdict(list)
          with open('principals.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  if r['tconst'] in basics and r['category'] == 'writer' and r['job'] == 'creator':
                      try: order = int(r['ordering'])
                      except: order = 999
                      creators_map[r['tconst']].append((order, r['nconst']))

          print("Loading crew...")
          writers_all = defaultdict(list)
          directors_all = defaultdict(list)
          with open('crew.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  t = r['tconst']
                  if t not in basics: continue
                  d = r.get('directors')
                  if d and d!= '\\N':
                      for nid in d.split(',')[:5]:
                          directors_all[t].append(nid)
                  w = r.get('writers')
                  if w and w!= '\\N':
                      limit = 3 if t in episode_ids else 15
                      for nid in w.split(',')[:limit]:
                          writers_all[t].append(nid)

          print("Loading actors...")
          actors_all = defaultdict(list)
          with open('principals.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  t = r['tconst']
                  if t not in basics or t in episode_ids: continue
                  if r['category'] in ('actor','actress','self') and len(actors_all[t]) < 10:
                      try: order = int(r['ordering'])
                      except: order = 999
                      actors_all[t].append((order, r['nconst']))

          print("Writing...")
          os.makedirs('out/titles', exist_ok=True)
          os.makedirs('out/episodes', exist_ok=True)
          count_main = 0
          count_ep = 0

          for tid, info in basics.items():
              shard = tid[2:4]
              is_ep = tid in episode_ids
              cr = creators_map.get(tid, [])
              cr_sorted = [n for _, n in sorted(cr)]
              if info['type'] in ('tvSeries','tvMiniSeries') and not cr_sorted and writers_all.get(tid):
                  cr_sorted = writers_all[tid][:2]

              if is_ep:
                  data = {
                      **info,
                      'directors': [{'id': nid, 'name': names.get(nid, nid)} for nid in directors_all.get(tid, [])],
                      'writers': [{'id': nid, 'name': names.get(nid, nid)} for nid in writers_all.get(tid, [])],
                  }
                  os.makedirs(f'out/episodes/{shard}', exist_ok=True)
                  with open(f'out/episodes/{shard}/{tid}.json', 'w', encoding='utf-8') as out:
                      json.dump(data, out, ensure_ascii=False)
                  count_ep += 1
              else:
                  data = {
                      **info,
                      'directors': [{'id': nid, 'name': names.get(nid, nid)} for nid in directors_all.get(tid, [])],
                      'writers': [{'id': nid, 'name': names.get(nid, nid)} for nid in writers_all.get(tid, [])],
                      'creators': [{'id': nid, 'name': names.get(nid, nid)} for nid in cr_sorted],
                      'actors': [{'id': nid, 'name': names.get(nid, nid)} for _, nid in sorted(actors_all.get(tid, []))]
                  }
                  os.makedirs(f'out/titles/{shard}', exist_ok=True)
                  with open(f'out/titles/{shard}/{tid}.json', 'w', encoding='utf-8') as out:
                      json.dump(data, out, ensure_ascii=False)
                  count_main += 1

          import datetime
          with open('out/version.json', 'w') as vf:
              json.dump({"updated": datetime.datetime.utcnow().isoformat()+"Z", "main": count_main, "episodes": count_ep}, vf)

          print(f"Done main={count_main} episodes={count_ep}")
          PY

      - name: Deploy
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git checkout --orphan gh-pages
          rm -rf.github
          rm -f basics.tsv crew.tsv principals.tsv names.tsv
          mv out/* .
          rm -rf out
          git add titles episodes version.json
          git commit -m "titles with episodes light"
          git push -f origin gh-pages
