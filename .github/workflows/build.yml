name: Build titles

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IMDb datasets
        run: |
          curl -L https://datasets.imdbws.com/title.basics.tsv.gz | gunzip > basics.tsv
          curl -L https://datasets.imdbws.com/title.crew.tsv.gz | gunzip > crew.tsv
          curl -L https://datasets.imdbws.com/title.principals.tsv.gz | gunzip > principals.tsv
          curl -L https://datasets.imdbws.com/name.basics.tsv.gz | gunzip > names.tsv

      - name: Build JSONs
        run: |
          python3 << 'PY'
          import csv, json, os
          from collections import defaultdict

          def to_int(v):
              if not v or v == r'\N': return None
              try: return int(v)
              except: return None
          def to_genres(v):
              if not v or v == r'\N': return []
              return v.split(',')

          print("Loading names...")
          names = {}
          with open('names.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  names[r['nconst']] = r['primaryName']

          print("Loading basics...")
          basics = {}
          with open('basics.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  tt = r['tconst']
                  typ = r['titleType']
                  if typ in ('movie','tvSeries','tvMiniSeries','tvMovie'):
                      basics[tt] = {
                          'title': r['primaryTitle'],
                          'type': typ,
                          'startYear': to_int(r.get('startYear')),
                          'endYear': to_int(r.get('endYear')),
                          'runtime': to_int(r.get('runtimeMinutes')),
                          'genres': to_genres(r.get('genres'))
                      }

          print("Loading creators - fixed...")
          creators_map = defaultdict(list)
          with open('principals.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  t = r['tconst']
                  if t not in basics: continue
                  cat = (r.get('category') or '').strip().lower()
                  job = (r.get('job') or '').strip().lower()
                  if cat == 'creator' or job == 'creator' or 'creator' in job:
                      try: order = int(r['ordering'])
                      except: order = 999
                      creators_map[t].append((order, r['nconst']))

          print("Loading crew...")
          writers_all, directors_all = defaultdict(list), defaultdict(list)
          with open('crew.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  t = r['tconst']
                  if t not in basics: continue
                  d = r.get('directors')
                  if d and d!= r'\N':
                      for nid in d.split(',')[:5]: directors_all[t].append(nid)
                  w = r.get('writers')
                  if w and w!= r'\N':
                      for nid in w.split(',')[:15]: writers_all[t].append(nid)

          print("Loading actors...")
          actors_all = defaultdict(list)
          with open('principals.tsv', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  t = r['tconst']
                  if t not in basics: continue
                  if r['category'] in ('actor','actress','self') and len(actors_all[t]) < 10:
                      try: order = int(r['ordering'])
                      except: order = 999
                      actors_all[t].append((order, r['nconst']))

          print("Writing shards...")
          shards = defaultdict(dict)
          for tid, info in basics.items():
              shard = tid[2:4]
              cr = creators_map.get(tid, [])
              seen=set(); cr_sorted=[]
              for _, nid in sorted(cr):
                  if nid not in seen:
                      seen.add(nid); cr_sorted.append(nid)

              shards[shard][tid] = {
                  **info,
                  'directors': [{'id': nid, 'name': names.get(nid, nid)} for nid in directors_all.get(tid, [])],
                  'writers': [{'id': nid, 'name': names.get(nid, nid)} for nid in writers_all.get(tid, [])],
                  'creators': [{'id': nid, 'name': names.get(nid, nid)} for nid in cr_sorted],
                  'actors': [{'id': nid, 'name': names.get(nid, nid)} for _, nid in sorted(actors_all.get(tid, []))]
              }

          os.makedirs('out/titles', exist_ok=True)
          for shard, data in shards.items():
              with open(f'out/titles/{shard}.json', 'w', encoding='utf-8') as out:
                  json.dump(data, out, ensure_ascii=False)
              print(f"shard {shard} -> {len(data)}")

          import datetime
          with open('out/version.json','w') as vf:
              json.dump({"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(), "total": len(basics)}, vf)
          PY
          
      - name: Deploy titles only
        run: |
          set -euo pipefail
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          rm -rf .github
          rm -f *.tsv
          touch .nojekyll
          mv out/titles ./titles
          mv out/version.json ./version.json
          rm -rf out
          git add .nojekyll titles version.json
          git commit -m "titles shards $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin gh-pages
      
